<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open when... 💌</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;600&display=swap">
<style>
:root{--bg:#fff1f5;--paper:#fffdf6;--pink:#ff9ec1;--deep:#d63a77;--coffee:#6b4332;--ink:#4a2a36;--env:#ffd3e2;--flap:#ffb6d0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1620;--paper:#3d2430;--ink:#ffe3ee;--env:#8a3d5d;--flap:#a84b72;--deep:#ff86b2}}
:root[data-theme="dark"]{--bg:#2a1620;--paper:#3d2430;--ink:#ffe3ee;--env:#8a3d5d;--flap:#a84b72;--deep:#ff86b2}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;overflow-x:hidden}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.pt{position:absolute;top:-40px;animation:fall linear infinite;opacity:.7}
@keyframes fall{to{transform:translateY(112vh) rotate(260deg)}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:26px 16px 50px;text-align:center}
.bow{width:80px;display:block;margin:0 auto}
h1{font-family:'Caveat','Fredoka',cursive;font-size:2.8rem;color:var(--deep);margin:.1em 0}
.intro{font-size:1.1rem;line-height:1.5;margin:0 0 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.env{position:relative;border:0;background:var(--env);border-radius:10px;padding:0;aspect-ratio:3/2;cursor:pointer;color:var(--ink);font:inherit;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .15s}
.env:hover{transform:translateY(-3px) rotate(-1deg)}
.env:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
.env::before{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(to bottom right,transparent 49.5%,rgba(0,0,0,.08) 50%) 0 0/50% 100% no-repeat,linear-gradient(to bottom left,transparent 49.5%,rgba(0,0,0,.08) 50%) 100% 0/50% 100% no-repeat}
.flap{position:absolute;left:0;right:0;top:0;height:55%;background:var(--flap);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:10px 10px 0 0}
.seal{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:1.5rem;z-index:2}
.lbl{position:absolute;left:6px;right:6px;bottom:8px;font-family:'Caveat',cursive;font-weight:700;font-size:1.25rem;line-height:1;z-index:2}
.env.done{opacity:.75}.env.done .flap{transform-origin:top;transform:scaleY(-1);clip-path:polygon(0 0,100% 0,50% 100%);height:0}
.env.lock{filter:grayscale(.6);cursor:not-allowed}
.count{margin-top:20px;opacity:.8}
.ov{position:fixed;inset:0;z-index:10;background:rgba(40,10,25,.55);display:none;align-items:center;justify-content:center;padding:18px}
.ov.on{display:flex}
.letter{background:var(--paper);max-width:480px;width:100%;max-height:85vh;overflow:auto;border-radius:6px;padding:26px 24px;text-align:left;box-shadow:0 12px 0 var(--pink);
background-image:repeating-linear-gradient(transparent 0 33px,rgba(214,58,119,.15) 33px 34px);animation:pop .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:translateY(40px) scale(.9);opacity:0}}
.letter h2{font-family:'Caveat',cursive;font-size:1.9rem;color:var(--deep);margin:0 0 6px}
.letter p{font-family:'Caveat',cursive;font-size:1.55rem;line-height:34px;margin:0;white-space:pre-line}
.sig{margin-top:8px!important;text-align:right;color:var(--deep)}
.x{margin-top:18px;border:0;border-radius:999px;padding:11px 24px;background:var(--coffee);color:#fff8fb;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.x:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.pt,.letter,.env{animation:none;transition:none}}
</style>
</head>
<body>
<div id="fx" aria-hidden="true"></div>
<main>
  <svg class="bow" viewBox="0 0 100 60" role="img" aria-label="Red bow"><path d="M50 30C34 4 6 8 8 30c-2 22 26 26 42 0Z" fill="#e4002b"/><path d="M50 30C66 4 94 8 92 30c2 22-26 26-42 0Z" fill="#e4002b"/><circle cx="50" cy="30" r="9" fill="#b80022"/></svg>
  <h1>Open when... 💌</h1>
  <p class="intro">Mimi, Mr Firm wrote these letters for you.<br>Open each one when you need it, or just because.</p>
  <div class="grid" id="grid"></div>
  <p class="count" id="count"></p>
</main>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="lt">
  <div class="letter"><h2 id="lt"></h2><p id="lb"></p><p class="sig">Always yours,<br>Mr Firm 🤍</p><div style="text-align:center"><button class="x" id="close">Close letter</button></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
// ✏️ EDIT THE LETTERS HERE
const LETTERS=[
 {t:"you miss me",e:"💗",b:"Close your eyes for a second.\nI'm right there with you, in every thought you have.\nDistance is only a number, and my love for you doesn't care about numbers.\nI miss you too, smmmmmmmm."},
 {t:"you had a hard day",e:"🫂",b:"Come here, take a deep breath.\nYou don't have to be strong every minute.\nYou are doing better than you think, and I'm so proud of you.\nTomorrow is a new page, and I'm still on your side."},
 {t:"you doubt your dream",e:"🌟",b:"Mimi, listen to me.\nYour dream of studying medicine is not too big for you. You are made for it.\nThe girl I know is kind, brave and works so hard.\nI believe in you more than anything."},
 {t:"you need a coffee",e:"☕",b:"Go make yourself a coffee, I'll wait.\nNow imagine me sitting across from you, stealing sips.\nThis one is on me. Warm cup, warm heart, and you are my favorite person to share it with."},
 {t:"you can't sleep",e:"🌙",b:"Put the phone down, little one.\nLet your shoulders drop and breathe slowly.\nSomeone out there is thinking of you with the biggest smile.\nGoodnight, my love. Sweet dreams of lilies."},
 {t:"you need a smile",e:"🌸",b:"Here is a reminder:\nyou are beautiful, funny, smart and a little bit chaotic in the best way.\nI fall for you again every time you laugh.\nNow smile for me. There it is. 💕"},
 {t:"you want the biggest one",e:"💌",b:"I could write a thousand letters and still not have enough words.\nYou are my favorite hello, my calmest place, my happiest thought.\nI love you smmmmmmmm, Mimi.\nI YEARN FOR YOU.",lock:true}
];
LETTERS.forEach((L,i)=>{
  const b=document.createElement('button'); b.className='env'+(L.lock?' lock':'');
  b.innerHTML=`<span class="flap"></span><span class="seal">${L.lock?'🔒':L.e}</span><span class="lbl">Open when ${L.t}</span>`;
  b.setAttribute('aria-label','Open when '+L.t);
  b.onclick=()=>open(i,b);
  if(L.lock) b.style.gridColumn='1 / -1';
  $('grid').appendChild(b);
});
let seen=new Set();
function upd(){
  const need=LETTERS.length-1;
  const last=$('grid').lastChild;
  if(seen.size>=need && last.classList.contains('lock')){last.classList.remove('lock');last.querySelector('.seal').textContent='💌';}
  $('count').textContent = seen.size>=need ? 'The last letter is unlocked 💌' : seen.size+' of '+need+' opened. The last one unlocks after.';
}
function open(i,btn){
  const L=LETTERS[i];
  if(btn.classList.contains('lock')){$('count').textContent='Open the other letters first 🔒';return;}
  $('lt').textContent='Open when '+L.t+' '+L.e; $('lb').textContent=L.b;
  $('ov').classList.add('on'); $('close').focus();
  if(!L.lock) seen.add(i); btn.classList.add('done'); upd();
}
function shut(){$('ov').classList.remove('on')}
$('close').onclick=shut;
$('ov').onclick=e=>{if(e.target===$('ov'))shut()};
addEventListener('keydown',e=>{if(e.key==='Escape')shut()});
upd();
// falling petals
for(let i=0;i<14;i++){const d=document.createElement('div');d.className='pt';d.textContent=['🌸','💗','🤍'][i%3];
  d.style.left=Math.random()*95+'%';d.style.fontSize=(14+Math.random()*14)+'px';
  d.style.animationDuration=(10+Math.random()*10)+'s';d.style.animationDelay=(-Math.random()*18)+'s';
  if(reduce)d.style.top=Math.random()*90+'%';$('fx').appendChild(d);}
</script>
</body>
</html>
